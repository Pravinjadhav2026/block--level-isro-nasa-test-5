<!doctype html>
<html lang="mr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>गणित-गंमत</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efff;--card:#fff;--ink:#241a4d;--mut:#6a6490;--p:#6c3fc5;--p2:#0b8fb3;--ok:#1f9d55;--bad:#d9480f;--line:#e2dbf7;--hl:#fff3c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112b;--card:#221b45;--ink:#f1ecff;--mut:#b4acd8;--p:#a98bff;--p2:#5ccbe8;--ok:#4cd68a;--bad:#ff8a5c;--line:#3a3166;--hl:#4a3f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112b;--card:#221b45;--ink:#f1ecff;--mut:#b4acd8;--p:#a98bff;--p2:#5ccbe8;--ok:#4cd68a;--bad:#ff8a5c;--line:#3a3166;--hl:#4a3f12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
header{background:linear-gradient(135deg,#6c3fc5,#0b8fb3);color:#fff;border-radius:20px;padding:16px 18px;position:relative;overflow:hidden}
header h1{margin:0;font-size:28px;font-weight:800;line-height:1.25}
header p{margin:2px 0 10px;opacity:.95;font-size:16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:99px;padding:3px 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.pill.on{background:#fff;color:#4a2fa0}
.score{margin-left:auto;background:rgba(255,255,255,.2);border-radius:99px;padding:3px 14px;font-weight:800}
.deco{position:absolute;right:12px;top:6px;font-size:34px;opacity:.9;letter-spacing:4px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}
.tab{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 6px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3}
.tab span{display:block;font-size:26px}
.tab.on{border-color:var(--p);background:var(--hl)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;min-height:300px}
.prog{height:12px;background:var(--line);border-radius:99px;position:relative;margin:4px 0 16px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .4s}
.prog b{position:absolute;top:-14px;font-size:24px;transition:left .4s;transform:translateX(-50%)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:15px;font-weight:700}
.q{font-size:34px;font-weight:800;text-align:center;margin:16px 0;line-height:1.4;word-break:break-word}
.q small{display:block;font-size:17px;color:var(--mut);font-weight:700}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:26px;font-weight:800;cursor:pointer}
.op:active{transform:scale(.97)}
.op.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{min-height:34px;text-align:center;font-weight:800;margin-top:12px;font-size:20px}
.btn{background:var(--p);color:#fff;border:0;border-radius:14px;padding:10px 22px;font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.big{font-size:64px;text-align:center;line-height:1.2}
.c{text-align:center}
input{font:inherit;font-size:26px;width:120px;text-align:center;border:2px solid var(--p);border-radius:12px;padding:6px;background:var(--bg);color:var(--ink)}
.tips{display:grid;gap:10px}
.tip{background:var(--bg);border-left:6px solid var(--p);border-radius:12px;padding:10px 14px;font-size:17px}
.tip b{display:block;font-size:19px}
.credit{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:6px 12px;margin:0 0 10px;font-size:15px;font-weight:700;line-height:1.4}
.credit b{font-size:17px;font-weight:800}
footer.by{margin-top:16px;text-align:center;background:var(--card);border:2px solid var(--p);border-radius:18px;padding:12px 14px;color:var(--ink);font-size:16px;font-weight:700;line-height:1.5}
footer.by b{display:block;color:var(--p);font-size:20px;font-weight:800}
.fly{position:fixed;font-size:30px;pointer-events:none;animation:up 1.2s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-220px) rotate(30deg);opacity:0}}
</style></head><body><div class="wrap">
<header><div class="deco">🚀🪐</div><h1>🧠 गणित-गंमत</h1><p>खेळा, सोडवा, तारे मिळवा!</p>
<div class="credit">✍️ निर्मिती : <b>श्री. प्रवीण वसंतराव जाधव</b><br>जि. प. केंद्रीय प्राथमिक शाळा, तालखेड</div>
<div class="bar"><button class="pill on" data-l="0">इयत्ता ५–६</button><button class="pill" data-l="1">इयत्ता ७–८</button><span class="score">⭐ <span id="st">0</span></span></div></header>
<div class="tabs" id="tabs"></div>
<div class="card" id="stage"></div>
<footer class="by">✍️ निर्मिती<b>श्री. प्रवीण वसंतराव जाधव</b>जि. प. केंद्रीय प्राथमिक शाळा, तालखेड</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let lvl=0,stars=0,Q={};
const TABS=[["⚡","झटपट गणित"],["🍎","चित्र-कोडे"],["🔮","पुढचा पॅटर्न"],["🕵️","गुप्त संख्या"],["🎲","वर्गातील खेळ"]];
function opts(a){const s=new Set([a]);let t=0;while(s.size<4&&t++<60){const d=R(1,Math.max(3,Math.round(Math.abs(a)*.2)+2));const v=a+(Math.random()<.5?-d:d);if(v>=0)s.add(v)}let k=1;while(s.size<4)s.add(a+k++);return shuf([...s])}
function addStar(n){stars+=n;$("#st").textContent=stars}
function burst(e){for(let i=0;i<7;i++){const s=document.createElement("span");s.className="fly";s.textContent=pick(["⭐","🎉","✨","🌟"]);s.style.left=(15+Math.random()*70)+"vw";s.style.top=(45+Math.random()*20)+"vh";document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
const gens=[
()=>{const e=pick(["🚀","🍭","⚽","🦁","🌟","🐯"]);let a,b,q,r;
 const t=lvl?R(0,4):R(0,2);
 if(t==0){a=R(lvl?120:12,lvl?890:89);b=R(lvl?110:11,lvl?790:79);q=a+" + "+b;r=a+b}
 else if(t==1){a=R(lvl?300:40,lvl?990:99);b=R(11,a-1);q=a+" − "+b;r=a-b}
 else if(t==2){a=R(lvl?11:3,lvl?25:12);b=R(lvl?4:2,lvl?12:9);q=a+" × "+b;r=a*b}
 else if(t==3){b=R(3,15);r=R(6,25);a=b*r;q=a+" ÷ "+b;r=r}
 else{a=R(5,25);q=a+"² (वर्ग)";r=a*a}
 return{h:e+" "+q+" = ?",a:r}},
()=>{const F=shuf(["🍎","🍌","🍇","🍓","🍍","🥭"]);const [A,B,C]=F;const a=R(2,lvl?12:8),b=R(2,lvl?12:8),c=R(2,lvl?12:8);
 const L=[A+"+"+A+"+"+A+" = "+3*a,A+"+"+B+"+"+B+" = "+(a+2*b)];
 if(!lvl)return{h:L.join("<br>")+"<br>"+B+"+"+A+"+"+A+" = ?",a:b+2*a,s:"प्रत्येक फळाची किंमत शोधा!"};
 L.push(B+"+"+C+"+"+C+" = "+(b+2*c));return{h:L.join("<br>")+"<br>"+A+"+"+B+"+"+C+" = ?",a:a+b+c,s:"प्रत्येक फळाची किंमत शोधा!"}},
()=>{const t=R(0,lvl?5:2);let s=[],a=R(1,12),d=R(2,9);
 if(t==0)for(let i=0;i<6;i++)s.push(a+d*i);
 else if(t==1){a=R(2,9);for(let i=0;i<6;i++)s.push(a*2**i);if(s[5]>400)return gens[2]()}
 else if(t==2){a=R(60,90);d=R(3,8);for(let i=0;i<6;i++)s.push(a-d*i)}
 else if(t==3)for(let i=1;i<=6;i++)s.push(i*i);
 else if(t==4){s=[1,3];for(let i=2;i<6;i++)s.push(s[i-1]+s[i-2])}
 else{a=R(2,4);for(let i=0;i<6;i++)s.push(a*3**i)}
 const r=s.pop();return{h:s.join(" , ")+" , <span style='color:var(--p)'>❓</span>",a:r,s:"पुढची संख्या कोणती?"}}];
function stage(h){$("#stage").innerHTML=h}
function startQuiz(g,name){Q={g,n:0,ok:0,total:10,t0:Date.now(),st:0,lock:false,name};nextQ()}
function nextQ(){if(Q.n>=Q.total)return endQ();const q=Q.cur=gens[Q.g]();Q.n++;Q.lock=false;
 const o=opts(q.a),p=(Q.n-1)/Q.total*100;
 stage(`<div class="meta"><span>प्रश्न ${Q.n}/${Q.total}</span><span>🔥 ${Q.st}</span></div><div class="prog"><i style="width:${p}%"></i><b style="left:${p}%">🚀</b></div>
 <div class="q">${q.s?"<small>"+q.s+"</small>":""}${q.h}</div><div class="ops">${o.map(v=>`<button class="op" data-v="${v}">${v}</button>`).join("")}</div><div class="fb" id="fb"></div>`);
 document.querySelectorAll(".op").forEach(b=>b.onclick=()=>ans(b))}
function ans(b){if(Q.lock)return;Q.lock=true;const ok=+b.dataset.v===Q.cur.a;
 if(ok){b.classList.add("ok");Q.ok++;Q.st++;addStar(1);burst();$("#fb").textContent=pick(["🎉 शाब्बास!","👏 अचूक!","🌟 जबरदस्त!","💪 मस्त!"])}
 else{b.classList.add("bad");Q.st=0;document.querySelectorAll(".op").forEach(x=>{if(+x.dataset.v===Q.cur.a)x.classList.add("ok")});$("#fb").textContent="🤔 काळजी नको, पुढच्या वेळी नक्की!"}
 setTimeout(nextQ,ok?900:1700)}
function endQ(){const s=Math.round((Date.now()-Q.t0)/1000),m=Q.ok>=9?"🏆 गणितवीर!":Q.ok>=6?"🌟 छान खेळलात!":"💪 सराव करत राहा!";
 stage(`<div class="big">${m.split(" ")[0]}</div><div class="q">${m.split(" ").slice(1).join(" ")}<small>${Q.ok} / ${Q.total} बरोबर · ${s} सेकंद</small></div><div class="c"><button class="btn" id="again">🔁 पुन्हा खेळा</button></div>`);
 $("#again").onclick=()=>startQuiz(Q.g,Q.name);if(Q.ok>=9)burst()}
function guess(){const max=lvl?200:50,tries=lvl?8:6;let n=R(1,max),left=tries;
 stage(`<div class="big">🕵️</div><div class="q">मी एक गुप्त संख्या ठरवली आहे!<small>१ ते ${max} मधली · ${tries} संधी · ती ${n%2?"विषम":"सम"} आहे</small></div>
 <div class="c"><input id="gi" type="number" inputmode="numeric"> <button class="btn" id="gb">ओळखा</button></div><div class="fb" id="fb"></div>`);
 $("#gb").onclick=()=>{const v=+$("#gi").value;if(!v)return;left--;const f=$("#fb");
  if(v===n){f.innerHTML="🎉 बरोबर! ती संख्या "+n+" होती!";addStar(3);burst();$("#gb").textContent="🔁 पुन्हा";$("#gb").onclick=guess;return}
  if(left==0){f.innerHTML="😮 संधी संपल्या! संख्या होती "+n;$("#gb").textContent="🔁 पुन्हा";$("#gb").onclick=guess;return}
  f.innerHTML=(v<n?"🔼 माझी संख्या यापेक्षा मोठी आहे":"🔽 माझी संख्या यापेक्षा लहान आहे")+"<br><small>उरलेल्या संधी: "+"❤️".repeat(left)+"</small>";$("#gi").value="";$("#gi").focus()}}
function tips(){const T=[["🧍","संख्या-रांग","प्रत्येकाला एक संख्या-कार्ड द्या. न बोलता, फक्त हावभावांनी चढत्या क्रमात रांग लावायची!"],
["🔔","बझ! खेळ","वर्तुळात १ पासून संख्या मोजा. ३ ने भाग जाणारी संख्या आली की “बझ!” म्हणा. चुकला तो बसतो."],
["🕵️","२० प्रश्न","शिक्षक/विद्यार्थी एक संख्या ठरवतो. बाकीचे फक्त “हो/नाही” प्रश्न विचारतात: “ती सम आहे का?”"],
["4️⃣","चार-चारची कमाल","४ , ४ , ४ , ४ आणि + − × ÷ वापरून १ ते १० संख्या बनवा. गटात स्पर्धा घ्या!"],
["🎂","माझी जादूई संख्या","जन्मदिनांकातील अंकांपासून आपली ‘स्वतःची संख्या’ बनवा आणि वर्गाला तिची १ गंमत सांगा."]];
 stage(`<div class="tips">${T.map(t=>`<div class="tip"><b>${t[0]} ${t[1]}</b>${t[2]}</div>`).join("")}</div>`)}
function go(i){document.querySelectorAll(".tab").forEach((b,j)=>b.classList.toggle("on",i==j));
 if(i<3)startQuiz(i,TABS[i][1]);else if(i==3)guess();else tips()}
$("#tabs").innerHTML=TABS.map((t,i)=>`<button class="tab" data-i="${i}"><span>${t[0]}</span>${t[1]}</button>`).join("");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(+b.dataset.i));
document.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{lvl=+b.dataset.l;document.querySelectorAll(".pill").forEach(x=>x.classList.toggle("on",x==b));go([...document.querySelectorAll(".tab")].findIndex(x=>x.classList.contains("on")))});
go(0);
</script></body></html>
